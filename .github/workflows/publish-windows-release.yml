name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: test
        type: choice
        options:
          - test
          - stable

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Velopack release
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version '${{ inputs.version }}' -Channel '${{ inputs.channel }}'

      - name: Upload GitHub release
        shell: pwsh
        env:
          VELOPACK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $arguments = @(
            'tool', 'run', 'vpk', '--',
            'upload', 'github',
            '--outputDir', '.\artifacts\releases',
            '--channel', '${{ inputs.channel }}',
            '--repoUrl', 'https://github.com/${{ github.repository }}',
            '--token', $env:VELOPACK_GITHUB_TOKEN,
            '--tag', 'v${{ inputs.version }}',
            '--releaseName', 'UISI Document Constructor ${{ inputs.version }}',
            '--targetCommitish', '${{ github.sha }}',
            '--publish', 'true'
          )

          if ('${{ inputs.channel }}' -eq 'test') {
            $arguments += @('--pre', 'true')
          }

          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Velopack could not publish the GitHub release.'
          }
